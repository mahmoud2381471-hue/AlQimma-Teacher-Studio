
name: Build AlQimma Teacher Studio V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q AlQimma_Teacher_Studio_V1_Source-1.zip -d source
          find source -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQimma-Teacher-Studio-V1-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
